function baseSecurityKeywords(item){
  const values=[item.name,item.ticker,item.yahoo,item.wrapper,item.bucket,item.type,item.isin,...(item.keywords||[])];
  const text=values.join(' ').toLowerCase();
  const extra=[];
  if((text.includes('world')&&!text.includes('worldline'))||text.includes('monde')||text.includes('all-world'))extra.push('world','monde','all world');
  if(text.includes('s&p')||text.includes('sp500')||text.includes('s&p 500'))extra.push('sp500','s&p','s&p 500');
  if(text.includes('nasdaq'))extra.push('nasdaq','tech','technologie');
  if(text.includes('emerg')||text.includes('émerg'))extra.push('emerging','emergent','émergents','emergents');
  if(text.includes('luxe')||['MC','RMS','KER'].includes(item.ticker))extra.push('luxe');
  if(text.includes('banque')||text.includes('finance'))extra.push('banque','finance');
  if(text.includes('santé')||text.includes('sante'))extra.push('santé','sante');
  if(text.includes('airbus')||text.includes('safran')||text.includes('thales'))extra.push('aéronautique','aeronautique','industrie');
  if(text.includes('énergie')||text.includes('energie')||text.includes('totalenergies')||text.includes('exxon'))extra.push('énergie','energie');
  if(text.includes('cac'))extra.push('cac','cac40','france');
  return [...new Set([...values.filter(Boolean).map(x=>String(x).toLowerCase()),...extra])];
}
(function normalizeCatalog(){
  const seen=new Map();
  for(let i=CATALOG.length-1;i>=0;i--){
    const item=CATALOG[i];
    const key=normalizeYahooCode(item.yahoo||item.ticker);
    if(seen.has(key)){
      const keep=seen.get(key);
      keep.keywords=[...new Set([...(item.keywords||[]),...(keep.keywords||[])])];
      keep.priority=Boolean(keep.priority||item.priority);
      if(!keep.isin&&item.isin)keep.isin=item.isin;
      CATALOG.splice(i,1);
    }else{
      seen.set(key,item);
    }
  }
  CATALOG.forEach(item=>{item.keywords=baseSecurityKeywords(item);});
})();

function loadApp(){
  try{
    const raw=localStorage.getItem(APP_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed.profiles))return parsed;
    }
    for(const oldKey of OLD_APP_KEYS){
      const oldRaw=localStorage.getItem(oldKey);
      if(oldRaw){
        const oldParsed=JSON.parse(oldRaw);
        if(Array.isArray(oldParsed.profiles)){localStorage.setItem(APP_KEY,oldRaw);return oldParsed;}
      }
    }
    return emptyAppState();
  }catch(e){return emptyAppState();}

function migrate(){
  appState.schemaVersion = appState.schemaVersion || "1.0";
  appState.profiles = Array.isArray(appState.profiles) ? appState.profiles : [];
  appState.profiles.forEach(p=>{
    p.id = p.id || uid();

    p.data = p.data || defaultData();

    p.data.profile={...base.profile,...(p.data.profile||{})};
    p.data.settings={...base.settings,...(p.data.settings||{})};
    if(typeof p.data.settings.dcaReminderEnabled !== "boolean") p.data.settings.dcaReminderEnabled = true;
    p.data.settings.dcaDay = Number(p.data.settings.dcaDay || 5);
    p.data.peaAllocation={...base.peaAllocation,...(p.data.peaAllocation||{})};
    p.data.assets=Array.isArray(p.data.assets)?p.data.assets:[];
    p.data.alerts=Array.isArray(p.data.alerts)?p.data.alerts:[];

  }
  const gross=patrimoineBrut();
  const debt=dettesTotales();
  const net=netWorth();
  const cash=byWrapper("Cash");
  const rec=dcaRecommendation().filter(r=>r.amount>1&&r.delta>0).sort((a,b)=>b.amount-a.amount)[0];
  if(gross<=0)return{title:"Ajoute tes premiers actifs",text:"Renseigne quelques montants pour obtenir une vision exploitable.",action:"setTab('positions')",button:"Ajouter un actif"};
  if(debt>0&&gross>0&&debt/gross>.75)return{title:"Dette à suivre",text:"Ta dette représente une part importante du patrimoine brut renseigné. Mets à jour la dette restante régulièrement.",action:"setTab('positions')",button:"Voir mes actifs"};

  if(rec)return{title:`${bucketLabel(rec.bucket)} sous ta cible`,text:`Selon ton profil et ta cible, cette catégorie est sous la répartition prévue. Montant indicatif du prochain DCA : ${euro(rec.amount)}.`,action:"setTab('plan')",button:"Voir le plan"};
  if(target>0)return{title:"Objectif en cours",text:`Ton objectif avance selon les données saisies : ${Math.min(net/target*100,100).toFixed(1)} % atteint.`,action:"setTab('plan')",button:"Voir mon plan"};
  return{title:"Patrimoine renseigné",text:"Cette suggestion est basée sur ton profil et tes données. Tu peux compléter tes actifs pour améliorer la synthèse.",action:"setTab('positions')",button:"Compléter"};
}

async function fetchWithTimeout(url,timeout=UPDATE_TIMEOUT_MS){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);try{const res=await fetch(url,{signal:controller.signal,cache:"no-store"});if(!res.ok)throw new Error("network");return await res.text()}finally{clearTimeout(timer)}}
function parseYahooChart(payload){if(!payload)return null;const json=typeof payload==="string"?JSON.parse(payload):payload;const data=json.contents?JSON.parse(json.contents):json;const meta=data?.chart?.result?.[0]?.meta;const price=meta?.regularMarketPrice??meta?.previousClose??meta?.chartPreviousClose;return Number.isFinite(Number(price))&&Number(price)>0?Number(price):null}
async function fetchYahooQuote(symbol,{force=false,allowReference=true}={}){const d=D();symbol=normalizeYahooCode(symbol);const cache=d?.quoteCache||(d?d.quoteCache={}:{});const entry=cache[symbol];if(!force&&entry&&(Date.now()-entry.ts<QUOTE_CACHE_MS))return{ok:true,price:entry.price,source:"cache"};const yahooUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=1d&interval=1d`;const urls=[`https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`,`https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yahooUrl)}`];for(const url of urls){try{const text=await fetchWithTimeout(url);const price=parseYahooChart(text);if(price){if(d)cache[symbol]={price,ts:Date.now()};return{ok:true,price,source:"market"}}}catch(e){}}
if(entry)return{ok:true,price:entry.price,source:"cache"};const ref=catalogItem(symbol);if(allowReference&&ref?.refPrice)return{ok:true,price:ref.refPrice,source:"reference"};return{ok:false,price:null,source:"none"}}
function getCachedQuote(symbol){const d=D();symbol=normalizeYahooCode(symbol);const entry=d?.quoteCache?.[symbol];if(entry&&Number(entry.price)>0)return{price:Number(entry.price),source:"cache",age:Date.now()-Number(entry.ts||0)};return{price:null,source:"none",age:null}}
function getDisplayQuote(itemOrSymbol){const symbol=normalizeYahooCode(typeof itemOrSymbol==="string"?itemOrSymbol:itemOrSymbol?.yahoo||itemOrSymbol?.ticker);const cached=getCachedQuote(symbol);if(cached.price&&cached.age!==null&&cached.age<QUOTE_CACHE_MS)return cached;const ref=typeof itemOrSymbol==="string"?catalogItem(symbol):itemOrSymbol;if(Number(ref?.refPrice)>0)return{price:Number(ref.refPrice),source:"reference",age:null};if(cached.price)return cached;return{price:null,source:"none",age:null}}
async function fetchLiveQuote(symbol,{allowReference=true}={}){return fetchYahooQuote(symbol,{force:true,allowReference})}
async function refreshQuote(symbol){return fetchLiveQuote(symbol,{allowReference:true})}

function normalizeSearchText(value){return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g," and ").replace(/[\s._-]+/g," ").trim()}
function scoreSecurity(item,query){const q=normalizeSearchText(query);if(!q)return item.priority?100:20;const ticker=normalizeSearchText(item.ticker);const yahoo=normalizeSearchText(item.yahoo);const name=normalizeSearchText(item.name);const type=normalizeSearchText(item.type);const wrapper=normalizeSearchText(item.wrapper);const bucket=normalizeSearchText(item.bucket);const isin=normalizeSearchText(item.isin);const keywords=(item.keywords||[]).map(normalizeSearchText);let score=0;if(ticker===q)score+=1000;if(yahoo===q)score+=1000;if(ticker.startsWith(q))score+=650;if(yahoo.startsWith(q))score+=650;if(name.startsWith(q))score+=450;if(name.includes(q))score+=260;if(type.includes(q))score+=170;if(isin&&isin.includes(q))score+=220;if(keywords.some(k=>k===q))score+=230;if(q.length>=4&&keywords.some(k=>(k.length>=4&&k.includes(q))||(k.length>=4&&q.includes(k))))score+=120;if(wrapper===q)score+=160;if(bucket===q)score+=160;if((q==="sp500"||q==="s&p500"||q==="s and p"||q==="standard poor")&&(keywords.includes("sp500")||keywords.includes("s&p")||keywords.includes("s&p 500")))score+=320;if(q==="s p"&&(keywords.includes("sp500")||keywords.includes("s&p 500")))score+=320;if(q==="world"||q==="monde")if(bucket==="world"||keywords.includes("world")||keywords.includes("monde"))score+=720;if(q==="emergent"||q==="emerging"||q==="emergents")if(bucket==="emerging"||keywords.some(k=>k.includes("emerg")))score+=320;if(q==="tech"||q==="technologie")if(keywords.includes("tech")||keywords.includes("technologie"))score+=220;if(q==="luxe"&&keywords.includes("luxe"))score+=220;if(q==="luxe"&&["MC","RMS","KER","OR"].includes(item.ticker))score+=360;if(q==="air"&&(ticker==="air"||name.includes("airbus")||name.includes("air liquide")))score+=260;return score}
function isLikelyIsin(query){return /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/i.test(String(query||"").trim())}
function isLikelyYahooSymbol(query){const raw=String(query||"").trim();if(isLikelyIsin(raw))return false;if(!raw||raw.length>14)return false;if(/\s/.test(raw))return false;if(!/^[A-Za-z0-9.-]+$/.test(raw))return false;return /[A-Za-z]/.test(raw)}
function makeFreeSecurity(query){if(!isLikelyYahooSymbol(query))return null;const direct=normalizeYahooCode(query);if(!direct||direct.length<1)return null;const yahoo=direct.includes(".")?direct:direct;return{name:`Utiliser ${yahoo} comme code Yahoo`,ticker:tickerFromYahoo(yahoo),yahoo,wrapper:guessWrapperFromYahoo(yahoo),bucket:"Other",type:"Saisie libre",isin:"",refPrice:0,keywords:["saisie libre",yahoo.toLowerCase()]}}
function mergeSecurityResults(local,remote=[]){const map=new Map();[...local,...remote].forEach(item=>{const key=normalizeYahooCode(item.yahoo||item.ticker);if(!key)return;if(!map.has(key))map.set(key,item);});return Array.from(map.values())}
function searchSecurities(query){const raw=String(query||"").trim();const q=normalizeSearchText(raw);let results=CATALOG.map(item=>({item,score:scoreSecurity(item,raw)})).filter(x=>q?x.score>0:x.item.priority).sort((a,b)=>b.score-a.score||String(a.item.name).localeCompare(String(b.item.name))).map(x=>x.item).slice(0,40);if(raw.length>=1){const direct=normalizeYahooCode(raw);const free=makeFreeSecurity(raw);const looksExplicitSymbol=raw===raw.toUpperCase()||raw.includes(".")||raw.includes("-");if(free&&(results.length===0||looksExplicitSymbol)&&!CATALOG.some(x=>normalizeYahooCode(x.yahoo)===direct||normalizeYahooCode(x.ticker)===direct))results.push(free)}return results}
async function yahooSearchRemote(query){const q=String(query||"").trim();if(q.length<2)return[];const yahooUrl=`https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=12&newsCount=0`;const urls=[`https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`,`https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yahooUrl)}`];for(const url of urls){try{const text=await fetchWithTimeout(url,3500);const rawJson=JSON.parse(text);const data=rawJson.contents?JSON.parse(rawJson.contents):rawJson;return(data.quotes||[]).filter(x=>x.symbol).slice(0,12).map(x=>({name:x.shortname||x.longname||x.symbol,ticker:String(x.symbol).replace(/\.PA$/,""),yahoo:x.symbol,wrapper:String(x.symbol||"").endsWith(".PA")?"PEA":"CTO",bucket:"Other",type:x.quoteType||"Valeur cotée",isin:"",refPrice:0,keywords:[q.toLowerCase(),String(x.exchange||"").toLowerCase()]}))}catch(e){}}
return[]}

function renderAssetSearchRemote(query,token,localResults){clearTimeout(assetSearchRemoteTimer);if(String(query||"").trim().length<2||localResults.length>=15)return;assetSearchRemoteTimer=setTimeout(async()=>{const remote=await yahooSearchRemote(query);if(token!==assetSearchToken)return;const merged=mergeSecurityResults(localResults,remote).slice(0,40);renderAssetSearchResults(merged)},350)}
async function updateMarket(silent=false,force=false){
  if(marketUpdating||!hasProfile())return;
  const d=D();
  const owned=securities().filter(asset=>{
    if(!asset.yahoo)return false;
    const entry=d.quoteCache?.[normalizeYahooCode(asset.yahoo)];
    return force||!entry||(Date.now()-entry.ts>=QUOTE_CACHE_MS);
  });
  if(!owned.length){if(!silent)toast("Cours déjà à jour");return;}
  marketUpdating=true;
  if(!silent)toast("Actualisation des cours…");
  let success=0, fallback=0;
  const groups=chunk(owned,UPDATE_CONCURRENCY);
  for(const group of groups){
    await Promise.allSettled(group.map(async asset=>{
      const result=await fetchYahooQuote(asset.yahoo,{force,allowReference:false});
      if(result.ok&&result.price){
        asset.price=result.price;
        asset.marketPrice=result.price;
        asset.mode=result.source==="market"?"market":result.source==="cache"?"cache":"reference";
        asset.updatedAt=new Date().toISOString();
        result.source==="market"?success++:fallback++;
      }
    }));
  }
  d.lastRefresh=new Date().toISOString();
  marketUpdating=false;
  saveApp();
  render();
  if(!silent){
    if(success)toast(`${success} cours live mis à jour`,1800);
    else if(fallback)toast(`${fallback} cours repris du cache`,1800);
    else toast("Cours indisponibles, données conservées",2200);
  }
}

function quoteHelpText(source){
  if(source==="market"||source==="live")return"Cours live récupéré. Prix modifiable.";
  if(source==="cache")return"Cours repris du cache. Prix modifiable.";
  if(source==="reference")return"Prix indicatif non actualisé. Modifiable.";
  if(source==="manual")return"Prix saisi manuellement.";
  return"Aucun cours disponible pour l’instant. Saisis un prix unitaire.";
}
function markListedPriceTouched(){
  listedPriceTouched=true;
  const source=document.getElementById("listedPriceSource");
  if(source)source.value="manual";
  refreshListedPreview();
}
function updateListedQuoteDisplay(result,{force=false}={}){
  const display=document.getElementById("marketPriceDisplay");
  const help=document.getElementById("marketPriceHelp");
  const input=document.getElementById("listedBuyPrice");
  const source=document.getElementById("listedPriceSource");
  if(!display||!help||!input)return;
  const price=Number(result?.price||0);
  const resultSource=result?.source||"none";
  if(price>0){
    display.textContent=euro(price,4);
    const shouldUpdateInput=!listedPriceTouched;
    if(shouldUpdateInput){
      input.value=String(price);
      if(source)source.value=resultSource;
      listedPriceTouched=false;
      help.innerHTML=`<span class="badge ${quoteStatusClass(resultSource)}">${quoteStatusLabel(resultSource)}</span> ${quoteHelpText(resultSource)}`;
      refreshListedPreview();
    }else{
      help.innerHTML=`<span class="badge ${quoteStatusClass(resultSource)}">${quoteStatusLabel(resultSource)}</span> Cours récupéré : ${euro(price,4)}. Prix saisi conservé.`;
    }
  }else{
    display.textContent="Cours indisponible";
    help.innerHTML=`<span class="badge red">Indisponible</span> Cours live indisponible, dernière valeur conservée.`;
  }
}
async function refreshListedModalQuote(symbol,force=false){
  const help=document.getElementById("marketPriceHelp");
  if(help)help.innerHTML=`<span class="badge blue">Recherche</span> Actualisation du cours…`;
  try{
    const result=await fetchLiveQuote(symbol,{allowReference:true});
    updateListedQuoteDisplay(result,{force});
  }catch(e){
    updateListedQuoteDisplay({ok:false,price:null,source:"none"},{force:false});
  }
}
function openListedForm(index){

  const item=lastSearchResults[index];
  if(!item)return;
  listedPriceTouched=false;

function saveDcaAssistOperation(){

  const qty=Number(document.getElementById("dcaAssistQty")?.value||0);

  }
  if(type==="income"){
    openModal("Mettre à jour les revenus",`<label class="field-label">Salaire mensuel</label><input id="editSalary" class="field" type="number" value="${p.salary||""}"><label class="field-label">Revenus annexes mensuels</label><input id="editSideIncome" class="field" type="number" value="${p.monthlySideIncome||""}"><label class="field-label">Bonus annuel</label><input id="editAnnualBonus" class="field" type="number" value="${p.annualBonus||""}"><div class="stack"><button class="btn full primary" onclick="saveQuickProfileEdit('income')">Enregistrer</button></div>`);
    return;
  }
  if(type==="expenses"){
    openModal("Mettre à jour les dépenses",`<label class="field-label">Dépenses mensuelles</label><input id="editExpenses" class="field" type="number" value="${p.expenses||""}"><div class="stack"><button class="btn full primary" onclick="saveQuickProfileEdit('expenses')">Enregistrer</button></div>`);
    return;
  }
  if(type==="dca"){
    openModal("Mettre à jour le DCA",`<label class="field-label">DCA mensuel</label><input id="editDca" class="field" type="number" value="${p.monthlyDca||""}"><label class="field-label">Jour du rappel DCA</label><input id="editDcaDay" class="field" type="number" min="1" max="28" value="${d.settings.dcaDay||5}"><div class="helper" style="margin-top:10px">Le rappel est indicatif et reste modifiable.</div><div class="stack"><button class="btn full primary" onclick="saveQuickProfileEdit('dca')">Enregistrer</button></div>`);
    return;
  }
  openModal("Mettre à jour les objectifs",`<label class="field-label">Patrimoine cible</label><input id="editTargetNetWorth" class="field" type="number" value="${p.targetNetWorth||""}"><label class="field-label">Objectif PEA</label><input id="editTargetPea" class="field" type="number" value="${p.targetPea||""}"><label class="field-label">Horizon PEA en années</label><input id="editYears" class="field" type="number" value="${p.peaHorizonYears||8}"><div class="stack"><button class="btn full primary" onclick="saveQuickProfileEdit('target')">Enregistrer</button></div>`);
}
function saveQuickProfileEdit(type){
  const d=requireData();
  const p=d.profile;
  if(type==="identity"){
    activeProfile().name=document.getElementById("editProfileName").value.trim()||activeProfile().name;
    p.objective=document.getElementById("editObjective").value;
    p.horizon=document.getElementById("editHorizon").value;
    p.risk=document.getElementById("editRisk").value;
  }else if(type==="income"){
    p.salary=safeAmount(document.getElementById("editSalary")?.value);
    p.monthlySideIncome=safeAmount(document.getElementById("editSideIncome")?.value);
    p.annualBonus=safeAmount(document.getElementById("editAnnualBonus")?.value);
  }else if(type==="expenses"){
    p.expenses=safeAmount(document.getElementById("editExpenses")?.value);
  }else if(type==="dca"){
    p.monthlyDca=safeAmount(document.getElementById("editDca")?.value);
    d.settings.dcaDay=Math.min(28,Math.max(1,safeAmount(document.getElementById("editDcaDay")?.value)||5));
    d.settings.dcaReminderEnabled=true;
  }else{
    p.targetNetWorth=safeAmount(document.getElementById("editTargetNetWorth")?.value);
    p.targetPea=safeAmount(document.getElementById("editTargetPea")?.value);
    p.peaHorizonYears=safeAmount(document.getElementById("editYears")?.value)||8;
  }
  saveApp();
  closeModal();
  render();
  toast("Profil mis à jour");
}
function openAllocationModal(){const d=requireData();const model=getProfileModel(d.profile);const a=d.peaAllocation;openModal("Répartition cible",`<div class="helper">La cible proposée dépend de ton horizon et de ton profil.</div><section class="card"><div class="label">Modèle proposé</div><div class="helper">${modelExplanation()}</div></section><div class="stack"><button class="btn full primary" onclick="applyProfileAllocationModel()">Appliquer le modèle</button></div><div class="field-row"><div><label class="field-label">World %</label><input id="allocWorld" class="field" type="number" value="${a.World||model.World}"></div><div><label class="field-label">Europe %</label><input id="allocEurope" class="field" type="number" value="${a.Europe||model.Europe}"></div></div><div class="field-row"><div><label class="field-label">Émergents %</label><input id="allocEmerging" class="field" type="number" value="${a.Emerging||model.Emerging}"></div><div><label class="field-label">Autres %</label><input id="allocOther" class="field" type="number" value="${a.Other||model.Other}"></div></div><div class="stack"><button class="btn full secondary" onclick="saveAllocation()">Sauvegarder manuellement</button></div>`)}
function applyProfileAllocationModel(){applyProfileModel();saveApp();closeModal();render();toast("Modèle appliqué")}
function saveAllocation(){const d=requireData();const alloc={World:safeAmount(document.getElementById("allocWorld").value),Europe:safeAmount(document.getElementById("allocEurope").value),Emerging:safeAmount(document.getElementById("allocEmerging").value),Other:safeAmount(document.getElementById("allocOther").value)};const total=alloc.World+alloc.Europe+alloc.Emerging+alloc.Other;if(Math.round(total)!==100)return toast("La somme doit faire 100 %");d.peaAllocation=alloc;saveApp();closeModal();render();toast("Répartition sauvegardée")}
function openProfilesModal(){openModal("Changer de profil",`${appState.profiles.map(p=>`<div class="profile-item"><div><div class="profile-name">${esc(p.name)}</div><div class="helper">${p.id===appState.activeProfileId?"Profil actif":objectiveLabel(p.data?.profile?.objective)}</div></div><div class="row-actions">${p.id!==appState.activeProfileId?`<button class="mini-btn green" onclick="switchProfile('${p.id}')">Utiliser</button>`:""}<button class="mini-btn" onclick="renameProfile('${p.id}')">Renommer</button>${appState.profiles.length>1?`<button class="mini-btn red" onclick="deleteProfile('${p.id}')">Supprimer</button>`:""}</div></div>`).join("")}<div class="stack"><button class="btn full primary" onclick="openCreateProfileModal()">Ajouter un profil</button></div>`)}
function openCreateProfileModal(){closeModal();startOnboarding()}
function switchProfile(id){appState.activeProfileId=id;saveApp();closeModal();currentTab="dashboard";render();toast("Profil changé")}
function renameProfile(id){const p=appState.profiles.find(x=>x.id===id);if(!p)return;const value=prompt("Nouveau nom",p.name);if(!value)return;p.name=value.trim();saveApp();openProfilesModal();render()}
function deleteProfile(id){const p=appState.profiles.find(x=>x.id===id);if(!p)return;if(!confirm(`Supprimer le profil ${p.name} ?`))return;appState.profiles=appState.profiles.filter(x=>x.id!==id);if(appState.activeProfileId===id)appState.activeProfileId=appState.profiles[0]?.id||null;saveApp();closeModal();render();toast("Profil supprimé")}
function triggerProfileImport(){const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=importProfile;input.click()}

function exportProfile(){const p=activeProfile();if(!p)return;const blob=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`patrimoine-profil-${p.name.toLowerCase().replace(/\s+/g,"-")}.json`;a.click();URL.revokeObjectURL(a.href);toast("Profil exporté")}
function importProfile(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(parsed?.data&&parsed?.id&&parsed?.name){const existing=appState.profiles.find(p=>p.id===parsed.id);if(existing)Object.assign(existing,parsed);else appState.profiles.push(parsed);appState.activeProfileId=parsed.id}else if(parsed?.profile&&parsed?.assets){const p=defaultProfile("Profil importé");p.data={...defaultData(),...parsed};appState.profiles.push(p);appState.activeProfileId=p.id}else throw new Error("invalid");migrate();saveApp();render();toast("Profil importé")}catch(e){toast("Fichier invalide")}};reader.readAsText(file);event.target.value=""}
function confirmDeleteLocalProfile(){const p=activeProfile();if(!p)return;const ok=confirm("Cette action supprimera uniquement ce profil local sur cet appareil. Cette action est irréversible si le profil n’a pas été exporté ou synchronisé. Confirmer la suppression ?");if(!ok)return;appState.profiles=appState.profiles.filter(x=>x.id!==p.id);appState.activeProfileId=appState.profiles[0]?.id||null;if(!appState.profiles.length)appState.hasCompletedFirstLaunch=false;saveApp(false);localStorage.removeItem(APP_KEY+"_backup_previous");if(!appState.profiles.length){localStorage.removeItem(APP_KEY+"_meta");localStorage.removeItem(CLOUD_LAST_SYNC_KEY);localStorage.removeItem(CLOUD_MODE_KEY);}currentTab="dashboard";render();toast("Données locales supprimées")}

async function getCurrentCloudUser(){if(!sb)return null;const {data}=await sb.auth.getUser();return data?.user||null}
function getCloudFields(){return{email:document.getElementById("cloudEmail")?.value.trim(),password:document.getElementById("cloudPassword")?.value}}
function openAccountModal(){if(!sb)return toast("Supabase indisponible");getCurrentCloudUser().then(user=>{const lastSync=localStorage.getItem(CLOUD_LAST_SYNC_KEY);const email=user?.email||localStorage.getItem(CLOUD_EMAIL_KEY)||"";openModal("Compte & synchronisation",`<div class="helper">Compte Patrimoine Pilot uniquement. Aucune connexion bancaire.</div>${user?`<section class="card"><div class="label">Compte connecté</div><div class="big-value" style="font-size:22px">${esc(user.email)}</div><div class="helper">Dernière synchro : ${lastSync?new Date(lastSync).toLocaleString("fr-FR"):"pas encore synchronisé"}</div></section><div class="stack"><button class="btn full primary" onclick="cloudSaveProfile()">Sauvegarder maintenant</button><button class="btn full secondary" onclick="cloudRestoreProfile()">Restaurer depuis le cloud</button><button class="btn full danger" onclick="cloudSignOut()">Se déconnecter</button></div>`:`<label class="field-label">Email</label><input id="cloudEmail" class="field" type="email" value="${esc(email)}" placeholder="vous@email.com"><label class="field-label">Mot de passe</label><input id="cloudPassword" class="field" type="password" placeholder="Mot de passe"><div class="stack"><button class="btn full primary" onclick="createAccountAndSync()">Créer un compte et synchroniser</button><button class="btn full secondary" onclick="signInAndRestore()">Se connecter</button></div>`}`)})}
async function createAccountAndSync(){try{if(!sb)return toast("Synchronisation indisponible");const{email,password}=getCloudFields();if(!email||!password)return toast("Email et mot de passe requis");const{error}=await sb.auth.signUp({email,password});if(error)throw error;localStorage.setItem(CLOUD_EMAIL_KEY,email);const user=await getCurrentCloudUser();if(!user){toast("Compte créé. Confirme ton email puis reconnecte-toi pour synchroniser.");return}localStorage.setItem(CLOUD_MODE_KEY,"cloud");await cloudAutoSaveProfile();closeModal();render();toast(localStorage.getItem(CLOUD_LAST_SYNC_KEY)?"Synchronisation active":"Compte créé. Reconnecte-toi pour synchroniser.")}catch(e){toast("Erreur compte : "+(e.message||e))}}
async function signInAndRestore(){try{if(!sb)return toast("Synchronisation indisponible");const{email,password}=getCloudFields();if(!email||!password)return toast("Email et mot de passe requis");const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;localStorage.setItem(CLOUD_EMAIL_KEY,email);const restored=await cloudRestoreProfile();if(restored)toast("Connecté");else toast("Connecté, aucun profil cloud restauré")}catch(e){localStorage.removeItem(CLOUD_MODE_KEY);toast("Erreur connexion : "+(e.message||e))}}
async function cloudAutoSaveProfile(){if(!sb||!hasProfile())return;const user=await getCurrentCloudUser();if(!user||localStorage.getItem(CLOUD_MODE_KEY)!=="cloud")return;const{error}=await sb.from("user_profiles").upsert({user_id:user.id,profile_data:activeProfile(),updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)throw error;localStorage.setItem(CLOUD_LAST_SYNC_KEY,new Date().toISOString())}
async function cloudSaveProfile(){try{if(!hasProfile())return;if(!sb)return toast("Synchronisation indisponible");const user=await getCurrentCloudUser();if(!user){localStorage.removeItem(CLOUD_MODE_KEY);return toast("Connecte-toi pour synchroniser")}localStorage.setItem(CLOUD_MODE_KEY,"cloud");await cloudAutoSaveProfile();render();toast(localStorage.getItem(CLOUD_LAST_SYNC_KEY)?"Profil sauvegardé":"Synchronisation non confirmée")}catch(e){toast("Erreur sauvegarde cloud")}}
async function cloudRestoreProfile(){try{if(!sb){toast("Synchronisation indisponible");return false}const user=await getCurrentCloudUser();if(!user){toast("Connecte-toi d’abord");return false}const{data,error}=await sb.from("user_profiles").select("profile_data,updated_at").eq("user_id",user.id).single();if(error)throw error;const restored=data.profile_data;if(!restored?.id||!restored?.data)throw new Error("invalid");const idx=appState.profiles.findIndex(p=>p.id===restored.id);if(idx>=0)appState.profiles[idx]=restored;else appState.profiles.push(restored);appState.activeProfileId=restored.id;migrate();saveApp(false);localStorage.setItem(CLOUD_MODE_KEY,"cloud");localStorage.setItem(CLOUD_LAST_SYNC_KEY,data.updated_at||new Date().toISOString());closeModal();render();toast("Profil restauré");return true}catch(e){localStorage.removeItem(CLOUD_MODE_KEY);toast("Aucun profil cloud trouvé");return false}}
async function cloudSignOut(){try{if(!sb)return toast("Synchronisation indisponible");await sb.auth.signOut();localStorage.removeItem(CLOUD_MODE_KEY);closeModal();render();toast("Déconnecté")}catch(e){toast("Erreur déconnexion")}}

Object.assign(window,{startOnboarding,selectOnboardingStorage,goOnboardingStep2,selectOnboardingObjective,selectOnboardingOption,goOnboardingStep3,saveOnboardingProfile,setTab,updateMarket,refreshOwnedQuotes,refreshQuote,refreshListedModalQuote,markListedPriceTouched,renderAssetSearch,searchSecurities,scoreSecurity,openListedSearch,openListedFormBySymbol,openListedForm,refreshListedPreview,saveListed,openBuy,refreshOneAsset,openLivretModal,saveLivret,handleLivretRateInput,openPropertyModal,saveProperty,openManualAmountModal,saveManualAmount,editAsset,deleteAsset,openTextImportModal,resetTextImportAnalysis,previewQuickTextImport,confirmQuickTextImport,openQuickProfileEdit,saveQuickProfileEdit,openAllocationModal,applyProfileAllocationModel,saveAllocation,openProfilesModal,openCreateProfileModal,switchProfile,renameProfile,deleteProfile,exportProfile,importProfile,confirmDeleteLocalProfile,openAccountModal,createAccountAndSync,signInAndRestore,cloudSaveProfile,cloudRestoreProfile,cloudSignOut,renderAlerts,openAlertModal,saveAlert,markAlertDone,markDcaDone,openDcaAssistModal,syncDcaAssistAsset,refreshDcaAssistPreview,saveDcaAssistOperation,requestBrowserNotifications,notificationCount,alertNotificationCount,planNotificationCount,updateNavBadges,getProfileCompletionStatus,diversificationScore,getLivretARate,refreshLivretARate,isProfileIncomplete,getProfileMissingFields,profileCompletionState,openProfileCompletionFromMissing,saveProfileCompletionFromMissing,triggerProfileImport,closeModal});
document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>setTab(btn.dataset.tab)));
render();
startAutoRefresh();
</script>
