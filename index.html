<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F0E7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Candice &amp; Louis" />
<title>Candice &amp; Louis — Le jeu photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F0E7; --panel:#FBF8F1; --ink:#4A443B; --muted:#9C9486;
  --line:#E3DCCD; --soft:#EFE9DD; --accent:#8C8472; --wine:#722F37;
  --sage:#8b9472; --dblue:#8ba4ae; --terra:#bd7d5c; --ochre:#c9a45c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Jost',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.crest{
  width:100%; height:100%;
  background-image:var(--crest-img);
  background-size:contain; background-repeat:no-repeat; background-position:center;
}
#app{
  min-height:100vh;
  display:flex; flex-direction:column; align-items:stretch;
  padding:28px 20px 40px;
  max-width:560px;
  margin:0 auto;
}
.kicker{
  font-family:'Jost',sans-serif; font-weight:600; font-size:.72rem;
  letter-spacing:.32em; text-transform:uppercase; color:var(--accent);
  text-align:center;
}
.names{
  font-family:'Parisienne',cursive; font-size:2.6rem; text-align:center;
  color:var(--ink); margin:6px 0 2px; line-height:1.1;
}
.hero-greeting{
  text-align:center; font-size:.9rem; color:var(--ink); margin:8px 0 0;
}
.crest-wrap{ width:150px; height:150px; margin:0 auto 6px; }
.crest-wrap.small{ width:96px; height:96px; }
header.hero{ text-align:center; margin-bottom:18px; }
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:26px 22px; box-shadow:0 2px 14px rgba(74,68,59,.06);
}
.stack{ display:flex; flex-direction:column; gap:14px; flex:1; }
.defi-num{
  text-align:center; font-family:'Jost'; font-weight:600; font-size:.7rem;
  letter-spacing:.28em; text-transform:uppercase; color:var(--muted); margin-bottom:0;
}
.defi-rule{ border:none; border-top:1px solid var(--line); margin:14px auto; width:60%; }
.defi-dash{ text-align:center; color:var(--muted); font-size:1rem; margin:-6px 0 4px; }
.defi-emoji{ text-align:center; font-size:3.2rem; margin-bottom:6px; }
.defi-text{
  font-family:'Cormorant',serif; font-style:italic; font-size:1.5rem; text-align:center;
  line-height:1.35; color:var(--ink); margin:0 0 22px;
}
.btn{
  display:block; width:100%; padding:15px 18px; border-radius:12px; border:none;
  font-family:'Jost'; font-weight:600; font-size:.82rem; letter-spacing:.14em;
  text-transform:uppercase; cursor:pointer; text-align:center; text-decoration:none;
}
.btn-primary{ background:var(--ink); color:var(--paper); }
.btn-primary:active{ opacity:.85; }
.btn-secondary{ background:var(--soft); color:var(--ink); border:1px solid var(--line); }
.btn-ghost{
  background:none; border:none; color:var(--accent); font-size:.75rem;
  letter-spacing:.14em; text-transform:uppercase; text-align:center; padding:8px;
  cursor:pointer; text-decoration:underline; font-family:'Jost';
}
.btn[disabled]{ opacity:.45; pointer-events:none; }
.field{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
.field input[type=text]{
  font-family:'Cormorant',serif; font-size:1.3rem; padding:12px 14px;
  border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink);
}
.hint{ text-align:center; font-size:.78rem; color:var(--muted); line-height:1.5; }
.row-gap{ display:flex; flex-direction:column; gap:10px; }
.thumb-preview{ width:100%; border-radius:14px; border:1px solid var(--line); display:block; margin-bottom:16px; max-height:60vh; object-fit:contain; background:var(--soft); }
.progress-outer{ width:100%; height:8px; background:var(--soft); border-radius:99px; overflow:hidden; margin:14px 0; }
.progress-inner{ height:100%; background:var(--wine); width:0%; transition:width .2s; }
.progress-label{ text-align:center; font-size:.78rem; color:var(--muted); letter-spacing:.08em; }
.error-box{ background:#f6e4e2; border:1px solid #e3b8b3; color:var(--wine); border-radius:10px; padding:12px 14px; font-size:.85rem; text-align:center; margin-bottom:14px; }
.count-badge{
  display:inline-block; font-family:'Jost'; font-weight:600; font-size:.72rem;
  letter-spacing:.18em; text-transform:uppercase; color:var(--accent); text-align:center;
  width:100%; margin-bottom:8px;
}
.big-check{ text-align:center; font-size:3rem; margin-bottom:6px; }
input[type=file]{ display:none; }
.reroll-msg{ text-align:center; font-size:.8rem; color:var(--muted); font-style:italic; font-family:'Cormorant',serif; padding:10px 0; }

/* Album */
.album-header{ display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:20px; }
.album-count{ font-size:.78rem; letter-spacing:.1em; color:var(--muted); }
.album-actions{ display:flex; gap:10px; margin-bottom:20px; }
.album-actions .btn{ font-size:.68rem; padding:12px 8px; }
.viewer{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:12px; }
.viewer-img-wrap{ position:relative; width:100%; aspect-ratio:1/1; background:var(--soft); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.viewer-img-wrap img{ width:100%; height:100%; object-fit:contain; }
.viewer-arrow{
  position:absolute; top:50%; transform:translateY(-50%); background:rgba(74,68,59,.55);
  color:#fff; border:none; width:38px; height:38px; border-radius:50%; font-size:1.1rem;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.viewer-arrow.prev{ left:10px; } .viewer-arrow.next{ right:10px; }
.viewer-meta{ padding:16px 18px; }
.viewer-index{ text-align:center; font-size:.72rem; letter-spacing:.2em; color:var(--muted); margin-bottom:8px; }
.viewer-quote{ font-family:'Cormorant',serif; font-style:italic; font-size:1.15rem; text-align:center; margin:0 0 6px; }
.viewer-guest{ text-align:center; font-size:.78rem; color:var(--muted); margin-bottom:14px; }
.viewer-dl{ display:flex; gap:10px; }
.viewer-dl .btn{ font-size:.66rem; padding:11px 8px; }
.thumb-rail{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; }
.thumb-rail img{
  width:58px; height:58px; object-fit:cover; border-radius:8px; border:2px solid transparent;
  cursor:pointer; flex-shrink:0; opacity:.65;
}
.thumb-rail img.active{ border-color:var(--wine); opacity:1; }
.empty-state, .error-state{ text-align:center; padding:40px 10px; color:var(--muted); font-family:'Cormorant',serif; font-size:1.15rem; font-style:italic; }
.zip-progress{ text-align:center; font-size:.78rem; color:var(--muted); margin-top:8px; }
a.link-back{ display:block; text-align:center; margin-top:22px; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); text-decoration:none; }
</style>

/* ---------- State ---------- */
var app = document.getElementById("app");
var state = {
  screen: "onboarding",
  name: localStorage.getItem("cl_name") || "",
  turnNumber: 0,
  currentDefiIndex: -1,
  rerollsUsed: 0,
  currentFile: null,
  currentObjectUrl: null,
  uploading: false,
  uploadError: "",
  album: { loaded:false, loading:false, error:"", photos:[], index:0 }
};

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function sanitizeContextValue(s){
  return String(s==null?"":s).replace(/[=|]/g, "").trim();
}
function letterSpace(s){
  return String(s).split("").join(" ");
}
function pickDefiIndex(avoid){
  var i;
  do { i = Math.floor(Math.random()*DEFIS.length); } while (DEFIS.length>1 && i===avoid);
  return i;
}

/* ---------- Routing ---------- */
function route(){
  var h = (location.hash||"").toLowerCase();
  var isAlbum = h.indexOf("album")>=0 || h.indexOf("galerie")>=0;
  if(isAlbum){
    state.screen = "album";
    render();
    if(!state.album.loaded && !state.album.loading) loadAlbum();
  } else {
    if(state.screen === "album"){
      state.screen = state.name ? "challenge" : "onboarding";
    }
    render();
  }
}
window.addEventListener("hashchange", route);

/* ---------- Render dispatch ---------- */
function render(){
  switch(state.screen){
    case "onboarding": return renderOnboarding();
    case "challenge": return renderChallenge();
    case "preview": return renderPreview();
    case "uploading": return renderUploading();
    case "thanks": return renderThanks();
    case "album": return renderAlbum();
  }
}

function heroHtml(kicker, greetingName){
  return '' +
    '<header class="hero">' +
      '<div class="crest-wrap"><div class="crest"></div></div>' +
      '<div class="names">Candice &amp; Louis</div>' +
      '<div class="kicker">' + esc(kicker) + '</div>' +
      (greetingName ? '<p class="hero-greeting">Salut ' + esc(greetingName) + ' 👋</p>' : '') +
    '</header>';
}

/* ---------- Onboarding ---------- */
function renderOnboarding(){
  app.innerHTML = '' +
    heroHtml("Le jeu photo") +
    '<div class="panel stack">' +
      '<p class="hint" style="margin-bottom:14px;">Toute la soirée, on va te proposer des petits défis photo à réaliser avec les autres invités — de quoi remplir l’album de souvenirs pour Candice &amp; Louis !</p>' +
      '<p class="hint" style="margin-bottom:6px;">Comment veux-tu qu’on t’appelle ce soir ?</p>' +
      '<div class="field">' +
        '<input type="text" id="nameInput" maxlength="30" placeholder="Ton prénom" autocomplete="given-name" />' +
      '</div>' +
      '<button class="btn btn-primary" id="nameGo">C’est parti</button>' +
    '</div>';
  var input = document.getElementById("nameInput");
  var go = document.getElementById("nameGo");
  function submit(){
    var v = input.value.trim();
    if(!v) { input.focus(); return; }
    state.name = v;
    localStorage.setItem("cl_name", v);
    startNewTurn();
  }
  go.addEventListener("click", submit);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
}

/* ---------- Challenge flow ---------- */
function startNewTurn(){
  state.turnNumber += 1;
  state.rerollsUsed = 0;
  state.currentDefiIndex = pickDefiIndex(state.currentDefiIndex);
  state.screen = "challenge";
  render();
}
function rerollDefi(){
  if(state.rerollsUsed >= 2) return;
  state.rerollsUsed += 1;
  state.currentDefiIndex = pickDefiIndex(state.currentDefiIndex);
  render();
}
function renderChallenge(){
  var defi = DEFIS[state.currentDefiIndex];
  var num = String(state.turnNumber).padStart(2,"0");
  var canReroll = state.rerollsUsed < 2;
  app.innerHTML = '' +
    heroHtml("Le jeu photo") +
    '<div class="panel stack">' +
      '<div class="defi-num">Défi nº ' + num + '</div>' +
      '<hr class="defi-rule" />' +
      '<div class="defi-emoji">' + defi[0] + '</div>' +
      '<p class="defi-text">' + esc(defi[1]) + '</p>' +
      '<div class="defi-dash">—</div>' +
      '<button class="btn btn-primary" id="takePhotoBtn">Réaliser ce défi</button>' +
      (canReroll
        ? '<button class="btn-ghost" id="rerollBtn">Changer de défi (' + (2-state.rerollsUsed) + ' restant' + ((2-state.rerollsUsed)>1?'s':'') + ')</button>'
        : '<p class="reroll-msg">C’est ce défi ou rien… à toi de jouer !</p>') +
      '<button class="btn-ghost" id="fromGalleryBtn">… ou depuis ma galerie</button>' +
    '</div>' +
    '<input type="file" accept="image/*" capture="environment" id="cameraInput" />' +
    '<input type="file" accept="image/*" id="galleryInput" />' +
    '<a class="link-back" href="#album">Accès album (mariés)</a>';

  document.getElementById("takePhotoBtn").addEventListener("click", function(){
    document.getElementById("cameraInput").click();
  });
  document.getElementById("fromGalleryBtn").addEventListener("click", function(){
    document.getElementById("galleryInput").click();
  });
  var rerollBtn = document.getElementById("rerollBtn");
  if(rerollBtn) rerollBtn.addEventListener("click", rerollDefi);
  document.getElementById("cameraInput").addEventListener("change", onFileChosen);
  document.getElementById("galleryInput").addEventListener("change", onFileChosen);
}
function onFileChosen(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  setCurrentFile(file);
  state.screen = "preview";
  render();
}
function setCurrentFile(file){
  if(state.currentObjectUrl){
    URL.revokeObjectURL(state.currentObjectUrl);
    state.currentObjectUrl = null;
  }
  state.currentFile = file;
  state.currentObjectUrl = URL.createObjectURL(file);
}

/* ---------- Upload ---------- */
function renderUploading(){
  app.innerHTML = '' +
    heroHtml("Le jeu photo") +
    '<div class="panel stack">' +
      '<p class="hint">Envoi de ta photo…</p>' +
      '<div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>' +
      '<div class="progress-label" id="progressLabel">0%</div>' +
    '</div>';
}
function startUpload(){
  state.uploadError = "";
  state.screen = "uploading";
  render();
  uploadToCloudinary(state.currentFile, DEFIS[state.currentDefiIndex][1], state.name,
    function onProgress(pct){
      var bar = document.getElementById("progressBar");
      var lbl = document.getElementById("progressLabel");
      if(bar) bar.style.width = pct + "%";
      if(lbl) lbl.textContent = pct + "%";
    }
  ).then(function(){
    if(state.currentObjectUrl){ URL.revokeObjectURL(state.currentObjectUrl); state.currentObjectUrl = null; }
    state.currentFile = null;
    var doneCount = parseInt(localStorage.getItem("cl_done")||"0",10) + 1;
    localStorage.setItem("cl_done", String(doneCount));
    state.screen = "thanks";
    render();
  }).catch(function(err){
    state.uploadError = err && err.message === "timeout"
      ? "L’envoi a pris trop de temps. Vérifie ta connexion et réessaie."
      : "L’envoi a échoué. Réessaie, ta photo est toujours là.";
    state.screen = "preview";
    render();
  });
}
function uploadToCloudinary(file, defiText, guestName, onProgress){
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    var url = "https://api.cloudinary.com/v1_1/" + CLOUDINARY.cloudName + "/image/upload";
    var fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CLOUDINARY.uploadPreset);
    fd.append("tags", CLOUDINARY.tag);
    var cleanDefi = sanitizeContextValue(defiText);
    var cleanGuest = sanitizeContextValue(guestName);
    fd.append("context", "defi=" + cleanDefi + "|guest=" + cleanGuest);
    xhr.open("POST", url, true);
    xhr.timeout = 120000;
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable) onProgress(Math.round((e.loaded/e.total)*100));
    };
    xhr.onload = function(){
      if(xhr.status>=200 && xhr.status<300) resolve(JSON.parse(xhr.responseText));
      else reject(new Error("upload_failed"));
    };
    xhr.onerror = function(){ reject(new Error("network_error")); };
    xhr.ontimeout = function(){ reject(new Error("timeout")); };
    xhr.send(fd);
  });
}

/* ---------- Album ---------- */
function albumImgUrl(photo, transform){
  return "https://res.cloudinary.com/" + CLOUDINARY.cloudName + "/image/upload/" + (transform ? transform + "/" : "") + photo.publicId + "." + photo.format;
}
function loadAlbum(){
  state.album.loading = true;
  state.album.error = "";
  render();
  var url = "https://res.cloudinary.com/" + CLOUDINARY.cloudName + "/image/list/" + CLOUDINARY.tag + ".json?_=" + Date.now();
  fetch(url).then(function(r){
    if(!r.ok) throw new Error("list_failed");
    return r.json();
  }).then(function(data){
    var resources = (data && data.resources) || [];
    resources.sort(function(a,b){
      return new Date(a.created_at||0) - new Date(b.created_at||0);
    });
    state.album.photos = resources.map(function(r){
      var ctx = (r.context && r.context.custom) || {};
      return {
        publicId: r.public_id,
        format: r.format,
        defi: ctx.defi || "",
        guest: ctx.guest || ""
      };
    });
    state.album.loaded = true;
    state.album.loading = false;
    state.album.index = 0;
    render();
  }).catch(function(){
    state.album.loading = false;
    state.album.error = "Impossible de charger l’album. Vérifie que l’option « Resource list » est bien activée dans les paramètres Cloudinary (Settings → Security).";
    render();
  });
}
function renderAlbum(){
  var a = state.album;
  var body;
  if(a.loading){
    body = '<div class="empty-state">Chargement de l’album…</div>';
  } else if(a.error){
    body = '<div class="error-state">' + esc(a.error) + '</div>';
  } else if(!a.photos.length){
    body = '<div class="empty-state">Aucune photo pour le moment. Revenez après les premiers envois !</div>';
  } else {
    body = renderAlbumViewerHtml();
  }
  app.innerHTML = '' +
    '<header class="album-header">' +
      '<div class="crest-wrap small"><div class="crest"></div></div>' +
      '<div class="names" style="font-size:1.9rem;">Candice &amp; Louis</div>' +
      '<div class="kicker">L’album · ' + WEDDING_DATE_LABEL + '</div>' +
      (a.loaded ? '<div class="album-count">' + a.photos.length + ' photo' + (a.photos.length>1?'s':'') + '</div>' : '') +
    '</header>' +
    '<div class="album-actions">' +
      '<button class="btn btn-secondary" id="zipAnnotatedBtn">Album avec les défis</button>' +
      '<button class="btn btn-secondary" id="zipPlainBtn">Album sans annotation</button>' +
    '</div>' +
    '<button class="btn-ghost" id="refreshBtn" style="margin-bottom:16px;">Actualiser</button>' +
    '<div id="zipStatus" class="zip-progress"></div>' +
    body +
    '<a class="link-back" href="#">← Retour au jeu</a>';

  document.getElementById("refreshBtn").addEventListener("click", loadAlbum);
  var zipA = document.getElementById("zipAnnotatedBtn");
  var zipP = document.getElementById("zipPlainBtn");
  if(a.photos.length){
    zipA.addEventListener("click", function(){ downloadZip(true); });
    zipP.addEventListener("click", function(){ downloadZip(false); });
  } else {
    zipA.disabled = true; zipP.disabled = true;
  }
  if(a.loaded && a.photos.length) bindViewerEvents();
}
function renderAlbumViewerHtml(){
  var a = state.album;
  var photo = a.photos[a.index];
  var idx = String(a.index+1).padStart(2,"0");
  var total = String(a.photos.length).padStart(2,"0");
  var thumbs = a.photos.map(function(p,i){
    return '<img data-idx="' + i + '" class="' + (i===a.index?'active':'') + '" src="' + albumImgUrl(p,"w_120,h_120,c_fill,q_auto,f_auto") + '" alt="" />';
  }).join("");
  return '' +
    '<div class="viewer">' +
      '<div class="viewer-img-wrap">' +
        '<img id="viewerMainImg" src="' + albumImgUrl(photo,"w_1200,q_auto,f_auto") + '" alt="" />' +
        (a.photos.length>1 ? '<button class="viewer-arrow prev" id="prevBtn">‹</button><button class="viewer-arrow next" id="nextBtn">›</button>' : '') +
      '</div>' +
      '<div class="viewer-meta">' +
        '<div class="viewer-index">' + idx + ' / ' + total + '</div>' +
        (photo.defi ? '<p class="viewer-quote">« ' + esc(photo.defi) + ' »</p>' : '') +
        (photo.guest ? '<p class="viewer-guest">par ' + esc(photo.guest) + '</p>' : '') +
        '<div class="viewer-dl">' +
          '<button class="btn btn-secondary" id="dlAnnotated">Avec le défi</button>' +
          '<a class="btn btn-secondary" id="dlOriginal" href="' + albumImgUrl(photo,"fl_attachment") + '">Original seul</a>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="thumb-rail" id="thumbRail">' + thumbs + '</div>';
}
function bindViewerEvents(){
  var a = state.album;
  function go(delta){
    a.index = (a.index + delta + a.photos.length) % a.photos.length;
    render();
  }
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  if(prevBtn) prevBtn.addEventListener("click", function(){ go(-1); });
  if(nextBtn) nextBtn.addEventListener("click", function(){ go(1); });
  document.getElementById("dlAnnotated").addEventListener("click", function(){
    downloadAnnotatedSingle(a.photos[a.index]);
  });
  var thumbRail = document.getElementById("thumbRail");
  thumbRail.addEventListener("click", function(e){
    var img = e.target.closest("img[data-idx]");
    if(!img) return;
    a.index = parseInt(img.getAttribute("data-idx"),10);
    render();
  });
  var wrap = document.querySelector(".viewer-img-wrap");
  var touchStartX = null;
  wrap.addEventListener("touchstart", function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
  wrap.addEventListener("touchend", function(e){
    if(touchStartX===null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    touchStartX = null;
  }, {passive:true});
  if(!bindViewerEvents._keyBound){
    bindViewerEvents._keyBound = true;
    document.addEventListener("keydown", function(e){
      if(state.screen !== "album" || !state.album.photos.length) return;
      if(e.key === "ArrowLeft") go(-1);
      if(e.key === "ArrowRight") go(1);
    });
  }
}

/* ---------- Canvas annotation ---------- */
var FONT_SPECS = ["48px Parisienne", "italic 30px Cormorant", "16px Jost"];
function preloadFonts(){
  return Promise.all(FONT_SPECS.map(function(f){ return document.fonts.load(f); }));
}
var crestImgEl = new Image();
var crestReady = new Promise(function(resolve){
  if(crestImgEl.complete && crestImgEl.naturalWidth){ resolve(); return; }
  crestImgEl.onload = function(){ resolve(); };
  crestImgEl.onerror = function(){ resolve(); };
});
crestImgEl.src = CREST_URI;
function wrapLines(ctx, text, maxWidth){
  var words = text.split(" ");
  var lines = [];
  var cur = "";
  for(var i=0;i<words.length;i++){
    var test = cur ? cur + " " + words[i] : words[i];
    if(ctx.measureText(test).width > maxWidth && cur){
      lines.push(cur);
      cur = words[i];
    } else {
      cur = test;
    }
  }
  if(cur) lines.push(cur);
  return lines;
}
function buildAnnotatedBlob(photo){
  return Promise.all([preloadFonts(), crestReady]).then(function(){
    return fetch(albumImgUrl(photo,"q_auto,f_auto")).then(function(r){
      if(!r.ok) throw new Error("fetch_failed");
      return r.blob();
    });
  }).then(function(blob){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var objUrl = URL.createObjectURL(blob);
      img.onload = function(){
        URL.revokeObjectURL(objUrl);
        try { resolve(drawAnnotated(img, photo)); }
        catch(err){ reject(err); }
      };
      img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error("img_load_failed")); };
      img.src = objUrl;
    });
  }).then(function(canvas){
    return new Promise(function(resolve){
      canvas.toBlob(function(blob){ resolve(blob); }, "image/jpeg", 0.92);
    });
  });
}
function drawAnnotated(img, photo){
  var margin = 46;
  var maxPhotoW = 1000;
  var scale = Math.min(1, maxPhotoW / img.width);
  var pw = Math.round(img.width * scale);
  var ph = Math.round(img.height * scale);

  var canvas = document.getElementById("workCanvas");
  var ctx = canvas.getContext("2d");
  var footerH = 210 + (photo.defi ? 60 : 0);
  canvas.width = pw + margin*2;
  canvas.height = ph + margin*2 + footerH;

  ctx.fillStyle = "#F5F0E7";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.drawImage(img, margin, margin, pw, ph);
  ctx.strokeStyle = "#E3DCCD";
  ctx.lineWidth = 1;
  ctx.strokeRect(margin+0.5, margin+0.5, pw-1, ph-1);

  var cx = canvas.width/2;
  var y = margin + ph + 34;

  var crestSize = Math.round(pw * 0.32);
  ctx.drawImage(crestImgEl, cx - crestSize/2, y - crestSize*0.62, crestSize, crestSize);
  y += crestSize*0.4;

  ctx.fillStyle = "#722F37";
  ctx.font = "44px Parisienne, cursive";
  ctx.textAlign = "center";
  ctx.fillText("Candice & Louis", cx, y);
  y += 26;

  ctx.strokeStyle = "#E3DCCD";
  ctx.beginPath();
  ctx.moveTo(cx - 60, y); ctx.lineTo(cx + 60, y);
  ctx.stroke();
  y += 34;

  if(photo.defi){
    ctx.fillStyle = "#4A443B";
    ctx.font = "italic 26px Cormorant, serif";
    var lines = wrapLines(ctx, "« " + photo.defi + " »", pw - 40);
    lines.forEach(function(line){
      ctx.fillText(line, cx, y);
      y += 32;
    });
    y += 4;
  }

  if(photo.guest){
    ctx.fillStyle = "#9C9486";
    ctx.font = "18px Jost, sans-serif";
    ctx.fillText("par " + photo.guest, cx, y);
    y += 28;
  }

  ctx.fillStyle = "#9C9486";
  ctx.font = "12px Jost, sans-serif";
  ctx.fillText(letterSpace(WEDDING_DATE_LABEL.toUpperCase()), cx, canvas.height - 24);

  return canvas;
}
function triggerDownload(blob, filename){
  var a = document.createElement("a");
  var url = URL.createObjectURL(blob);
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function downloadAnnotatedSingle(photo){
  var statusEl = document.getElementById("zipStatus");
  if(statusEl) statusEl.textContent = "Préparation de la photo…";
  buildAnnotatedBlob(photo).then(function(blob){
    if(statusEl) statusEl.textContent = "";
    triggerDownload(blob, photo.publicId + "-defi.jpg");
  }).catch(function(){
    if(statusEl) statusEl.textContent = "Échec de la préparation de cette photo.";
  });
}
function downloadZip(annotated){
  var a = state.album;
  if(!a.photos.length) return;
  var statusEl = document.getElementById("zipStatus");
  var zip = new JSZip();
  var done = 0;
  var total = a.photos.length;
  function updateStatus(){
    if(statusEl) statusEl.textContent = "Génération " + done + " / " + total + "…";
  }
  updateStatus();
  var chain = Promise.resolve();
  a.photos.forEach(function(photo, i){
    chain = chain.then(function(){
      var task = annotated
        ? buildAnnotatedBlob(photo)
        : fetch(albumImgUrl(photo)).then(function(r){ return r.blob(); });
      return task.then(function(blob){
        var name = String(i+1).padStart(3,"0") + "-" + (photo.guest ? photo.guest.replace(/[^a-z0-9]/gi,"") + "-" : "") + photo.publicId + "." + (annotated ? "jpg" : photo.format);
        zip.file(name, blob);
        done++;
        updateStatus();
      }).catch(function(){
        done++;
        updateStatus();
      });
    });
  });
  chain.then(function(){
    if(statusEl) statusEl.textContent = "Compression du zip…";
    return zip.generateAsync({type:"blob"});
  }).then(function(blob){
    if(statusEl) statusEl.textContent = "";
    triggerDownload(blob, "album-candice-louis" + (annotated ? "-defis" : "") + ".zip");
  });
}

/* ---------- Init ---------- */
function init(){
  var h = (location.hash||"").toLowerCase();
  var isAlbum = h.indexOf("album")>=0 || h.indexOf("galerie")>=0;
  if(isAlbum){
    state.screen = "album";
    render();
    loadAlbum();
    return;
  }
  if(!state.name){
    state.screen = "onboarding";
    render();
  } else {
    startNewTurn();
  }
}
init();
})();
