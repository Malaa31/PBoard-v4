<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mondial 2026 ⚽</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;
  --surface:#161627;
  --surface2:#1e1e35;
  --red:#e63946;
  --gold:#ffd700;
  --green:#52b788;
  --blue:#4361ee;
  --text:#e8e8f5;
  --dim:#7878a0;
  --border:rgba(255,255,255,0.07);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:20px}

/* HEADER */
.header{background:linear-gradient(160deg,#001f6b 0%,#c1001a 55%,#006232 100%);padding:24px 16px 52px;text-align:center;position:relative;overflow:hidden}
.header::after{content:'⚽';position:absolute;font-size:180px;opacity:0.06;top:-30px;right:-20px;pointer-events:none}
.hbadge{display:inline-block;background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.htitle{font-size:26px;font-weight:900;letter-spacing:-0.5px;line-height:1.1}
.hsub{font-size:12px;opacity:0.75;margin-top:6px}

/* TABS */
.tabs{background:var(--surface);display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;margin-top:-32px;border-radius:16px 16px 0 0;overflow:hidden}
.tab{flex:1;padding:13px 4px 11px;background:none;border:none;border-bottom:3px solid transparent;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--red)}

/* CONTENT */
.content{padding:14px 12px}

/* CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}

/* DATE LABEL */
.dlabel{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;padding:14px 0 7px}
.dlabel.today-lbl{color:var(--gold)}

/* MATCH CARD */
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;position:relative;overflow:hidden}
.mcard.france-match{border-color:rgba(255,215,0,0.5);background:linear-gradient(135deg,var(--surface),#1a1a30)}
.mcard.france-match::before{content:'⭐ Les Bleus';position:absolute;top:0;right:12px;background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:2px 10px;border-radius:0 0 8px 8px}
.mcard.live{border-color:var(--green)}
.mcard.done{opacity:.68}
.mcard.simul{border-left:3px solid var(--blue)}

.mrow{display:flex;align-items:center;gap:6px}
.team{flex:1;display:flex;align-items:center;gap:7px}
.team.r{flex-direction:row-reverse;text-align:right}
.tflag{font-size:22px;flex-shrink:0;line-height:1}
.tname{font-size:13px;font-weight:700;line-height:1.2}
.tname.small{font-size:11px;color:var(--dim)}
.center{text-align:center;flex-shrink:0;min-width:68px;padding:0 4px}
.score{font-size:22px;font-weight:900;letter-spacing:3px;font-variant-numeric:tabular-nums}
.htime{font-size:19px;font-weight:800;color:var(--gold)}
.hvs{font-size:11px;color:var(--dim);font-weight:600}

.mmeta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}
.minfo{font-size:11px;color:var(--dim)}
.chs{display:flex;gap:4px;align-items:center}
.ch{font-size:10px;font-weight:800;padding:2px 8px;border-radius:4px}
.ch.m6{background:#e8620a;color:#fff}
.ch.bein{background:#003580;color:#fff}
.ch.m6plus{background:#d04000;color:#fff}
.stbadge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.stbadge.live{background:rgba(82,183,136,.2);color:var(--green)}
.stbadge.done{background:rgba(255,255,255,.06);color:var(--dim)}
.stbadge.soon{background:rgba(255,215,0,.12);color:var(--gold)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* SIMUL TAG */
.simul-tag{font-size:9px;color:var(--blue);font-weight:700;margin-left:4px}

/* GROUPS GRID */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px}
.gcard h3{font-size:11px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}
.gteam{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;font-weight:600}
.gteam.fr{color:var(--gold);font-weight:800}

/* TV PAGE */
.tv-section{margin-bottom:20px}
.tv-section h2{font-size:14px;font-weight:800;margin-bottom:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.tv-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}
.tv-card.m6-card{border-color:rgba(232,98,10,.4)}
.tv-card.bein-card{border-color:rgba(0,53,128,.4)}
.tv-logo-big{display:inline-block;font-size:22px;font-weight:900;padding:6px 18px;border-radius:8px;margin-bottom:12px}
.tv-logo-big.m6{background:#e8620a;color:#fff}
.tv-logo-big.bein{background:#003580;color:#fff}
.tv-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.tv-ico{font-size:18px;flex-shrink:0;margin-top:1px}
.tv-txt{font-size:13px;line-height:1.5;color:var(--text)}
.tv-txt strong{color:var(--gold)}
.slots-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.slot{background:var(--surface2);border-radius:8px;padding:10px;text-align:center}
.slot-time{font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.slot-tz{font-size:10px;color:var(--dim);margin-top:2px}
.note-box{background:var(--surface2);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--dim);line-height:1.6;margin-top:10px}
.note-box strong{color:var(--text)}

/* PHASE BANNER */
.phase-banner{background:var(--surface2);border-radius:10px;padding:10px 14px;margin:14px 0 8px;display:flex;align-items:center;justify-content:space-between}
.phase-name{font-size:13px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.phase-dates{font-size:11px;color:var(--dim)}

/* EMPTY */
.empty{text-align:center;padding:50px 16px;color:var(--dim)}
.empty .eico{font-size:52px;margin-bottom:12px}

/* STATS CHIPS */
.stat-row{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-val{font-size:24px;font-weight:900}
.stat-lbl{font-size:10px;color:var(--dim);margin-top:2px;font-weight:600;text-transform:uppercase}
</style>
</head>

/* ========== HELPERS ========== */

function today() {
  return new Date().toISOString().slice(0,10);
}

function fmtDate(d) {
  const [y,mo,da] = d.split('-');
  const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const months = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
  const dt = new Date(+y,+mo-1,+da);
  return `${days[dt.getDay()]} ${+da} ${months[+mo-1]}`;
}

function isToday(d) { return d === today(); }
function isFrance(m) { return m.t1==='France' || m.t2==='France'; }
function isKnown(m) { return !!FLAGS[m.t1]; }

function chBadges(ch) {
  if(ch==='m') return `<span class="ch m6">M6</span><span class="ch m6plus">M6+</span><span class="ch bein">beIN</span>`;
  return `<span class="ch bein">beIN</span>`;
}

function stBadge(m) {
  if(m.st==='live') return `<span class="stbadge live"><span class="live-dot"></span>En direct</span>`;
  if(m.st==='done') return `<span class="stbadge done">Terminé</span>`;
  // check if upcoming match is "today"
  if(m.d===today()) return `<span class="stbadge soon">⏰ Aujourd'hui</span>`;
  return '';
}

function matchCard(m) {
  const fr = isFrance(m);
  const f1 = FLAGS[m.t1] || '🏳️';
  const f2 = FLAGS[m.t2] || '🏳️';
  const cls = [
    'mcard',
    fr ? 'france-match' : '',
    m.st==='live' ? 'live' : '',
    m.st==='done' ? 'done' : '',
    m.sim ? 'simul' : ''
  ].filter(Boolean).join(' ');

  const grpLabel = m.g ? `Groupe ${m.g}` : (m.rnd || '');
  const simulTag = m.sim ? `<span class="simul-tag">⟳ simultané</span>` : '';

  let centerHTML;
  if(m.st==='done' && m.sc) {
    centerHTML = `<div class="score">${m.sc}</div>`;
  } else if(m.st==='live') {
    centerHTML = `<div class="score" style="color:var(--green)">${m.sc||'? - ?'}</div>`;
  } else {
    centerHTML = `<div class="htime">${m.h}</div><div class="hvs">vs</div>`;
  }

  const t1small = !FLAGS[m.t1] ? 'small' : '';
  const t2small = !FLAGS[m.t2] ? 'small' : '';

  return `<div class="${cls}">
  <div class="mrow">
    <div class="team">
      <span class="tflag">${f1}</span>
      <span class="tname ${t1small}">${m.t1}</span>
    </div>
    <div class="center">${centerHTML}</div>
    <div class="team r">
      <span class="tflag">${f2}</span>
      <span class="tname ${t2small}">${m.t2}</span>
    </div>
  </div>
  <div class="mmeta">
    <span class="minfo">${grpLabel}${simulTag}</span>
    <div class="chs">${stBadge(m)}${chBadges(m.ch)}</div>
  </div>
</div>`;
}

function groupMatchesByDate(list) {
  const map = new Map();
  list.forEach(m => {
    if(!map.has(m.d)) map.set(m.d,[]);
    map.get(m.d).push(m);
  });
  return map;
}

function renderList(list) {
  if(!list.length) return `<div class="empty"><div class="eico">🔍</div>Aucun match trouvé</div>`;
  const byDate = groupMatchesByDate(list);
  let html = '';
  const td = today();
  let prevRnd = null;
  byDate.forEach((matches, date) => {
    const isT = date===td;
    html += `<div class="dlabel ${isT?'today-lbl':''}">`;
    html += isT ? `📅 AUJOURD'HUI – ${fmtDate(date)}` : fmtDate(date);
    html += `</div>`;

    matches.forEach(m => {
      // insert phase banner for knockout rounds
      const rnd = m.rnd || (m.g ? 'Phase de groupes' : '');
      if(rnd && rnd!==prevRnd && !m.g) {
        html += `<div class="phase-banner"><span class="phase-name">🏆 ${rnd}</span></div>`;
        prevRnd = rnd;
      }
      html += matchCard(m);
    });
  });
  return html;
}

/* ========== STATE & RENDER ========== */

let tab = 'today';
let grpFilter = 'all';

function setTab(t) {
  tab = t;
  grpFilter = 'all';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('t-'+t).classList.add('on');
  render();
}

function setGrp(g) {
  grpFilter = g;
  document.querySelectorAll('.chip').forEach(b=>{
    b.classList.toggle('on', b.dataset.g===g);
  });
  renderMatchList();
}

let lastRenderedTab = null;

function render() {
  lastRenderedTab = tab;
  const app = document.getElementById('app');
  if(tab==='today') renderToday(app);
  else if(tab==='all') renderAll(app);
  else if(tab==='france') renderFrance(app);
  else if(tab==='groups') renderGroups(app);
  else if(tab==='tv') renderTV(app);
}

function renderToday(app) {
  const td = today();
  const matches = M.filter(m=>m.d===td);

  // also show matches that started "last night" (from previous day but >00:00 today)
  // And next upcoming matches if nothing today
  let html = '';

  // Stats row
  const done = M.filter(m=>m.st==='done').length;
  const france = M.filter(m=>isFrance(m)).length;
  html += `<div class="stat-row">
    <div class="stat"><div class="stat-val">${done}</div><div class="stat-lbl">Terminés</div></div>
    <div class="stat"><div class="stat-val">${M.length-done}</div><div class="stat-lbl">À venir</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--gold)">3</div><div class="stat-lbl">Matchs France</div></div>
  </div>`;

  if(matches.length) {
    html += `<div class="dlabel today-lbl">📅 Aujourd'hui – ${fmtDate(td)}</div>`;
    matches.forEach(m=>{ html+=matchCard(m); });
  } else {
    // Next upcoming day
    const upcoming = M.filter(m=>m.d>td&&m.st!=='done').slice(0,6);
    if(upcoming.length) {
      const nextDate = upcoming[0].d;
      const nextMatches = upcoming.filter(m=>m.d===nextDate);
      html += `<div class="empty"><div class="eico">📭</div>Pas de match aujourd'hui</div>`;
      html += `<div class="dlabel">⏭ Prochains matchs – ${fmtDate(nextDate)}</div>`;
      nextMatches.forEach(m=>{ html+=matchCard(m); });
    } else {
      html += `<div class="empty"><div class="eico">🏆</div>Tournoi terminé !</div>`;
    }
  }

  // France next match
  const nextFr = M.filter(m=>isFrance(m)&&m.st!=='done'&&m.d>=td)[0];
  if(nextFr && nextFr.d!==td) {
    html += `<div class="dlabel" style="color:var(--gold)">🇫🇷 Prochain match France</div>`;
    html += matchCard(nextFr);
  }

  app.innerHTML = html;
}

function renderMatchList() {
  const container = document.getElementById('match-list');
  if(!container) return;
  let list = M;
  if(grpFilter!=='all') list = M.filter(m=>m.g===grpFilter);
  container.innerHTML = renderList(list);
}

  const groupKeys = Object.keys(GROUPS);

}

// Update statuses dynamically based on current time
function updateStatuses() {
  const now = new Date();
  M.forEach(m => {
    if(m.st==='done') return;
    const [hh,mm] = m.h.split(':').map(Number);
    const matchStart = new Date(m.d+'T'+m.h+':00+02:00'); // CEST
    const matchEnd = new Date(matchStart.getTime() + 110*60*1000); // ~110min
    if(now >= matchStart && now <= matchEnd) m.st = 'live';
    else if(now > matchEnd && m.d <= today()) {
      // Don't auto-mark as done — scores need manual update
    }
  });
}
